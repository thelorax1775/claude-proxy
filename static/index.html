<title>claude-proxy</title>
<link rel="stylesheet" href="/static/style.css">

<div id="app">
  <div id="sidebar">
    <h2>Backends (failover order)</h2>
    <div id="backend-list"></div>

    <h2>Add backend</h2>
    <form class="add-form" id="add-form">
      <label>Provider preset
        <select id="preset-select"></select>
      </label>
      <label>Name
        <input id="f-name" required placeholder="e.g. groq">
      </label>
      <label>Base URL
        <input id="f-base-url" required placeholder="https://api.groq.com/openai/v1">
      </label>
      <label>API key <span class="hint">(blank is fine for local Ollama)</span>
        <input id="f-api-key" type="password" placeholder="paste key here, never in chat">
      </label>
      <button type="button" class="secondary-btn" id="detect-btn">Detect models</button>
      <div class="hint" id="detect-hint"></div>
      <label>Default model
        <input id="f-big-model" list="model-options" required placeholder="e.g. llama-3.3-70b-versatile">
      </label>
      <label>Fast model <span class="hint">(used for haiku-mapped calls)</span>
        <input id="f-small-model" list="model-options" placeholder="defaults to Default model">
      </label>
      <datalist id="model-options"></datalist>
      <button type="submit" class="primary-btn">Add backend</button>
      <div class="hint error" id="add-error"></div>
    </form>
  </div>

  <div id="main">
    <div id="chat-header">
      <select id="chat-backend"></select>
      <select id="chat-model"></select>
      <button class="secondary-btn" id="clear-btn">Clear chat</button>
      <span class="hint" id="chat-hint"></span>
    </div>
    <div id="messages">
      <div class="empty-state">Add a backend on the left, pick it above, and start chatting.</div>
    </div>
    <div id="composer">
      <textarea id="composer-input" placeholder="Message... (Enter to send, Shift+Enter for newline)"></textarea>
      <button class="primary-btn" id="send-btn">Send</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
